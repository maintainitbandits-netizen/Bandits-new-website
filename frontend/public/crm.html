 ${L.map((j,i)=>{const a=jaddr(j),c=S.clients[j.client]||{};return`<div class="card"><div class="sp"><b>${i+1}. ${E(cname(j.client))}</b><span><button onclick="mvStop('${j.id}',-1)">▲</button> <button onclick="mvStop('${j.id}',1)">▼</button></span></div>
 <div class="m">${E(a||"No address")}</div><div class="m">${E(j.service)} · ${money(j.price)} · <span class="chip">${j.status}</span></div>
 <div class="row">${a?`<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(A(a))}" target="_blank" rel="noopener">Navigate</a>`:""}${c.phone?`<a class="btn" href="tel:${E(c.phone)}">Call</a>`:""}${j.status=="Scheduled"?`<button class="pri" onclick="setStatus('${j.id}','Done')">Mark Done</button>`:""}</div></div>`}).join("")||'<p class="m">No stops for this date.</p>'}`}
function order(L){L.forEach((j,k)=>{if(j.ord!==k){j.ord=k;w("jobs",j)}});render()}
function mvStop(id,d){const L=dayJobs(),i=L.findIndex(j=>j.id==id),k=i+d;if(k<0||k>=L.length)return;[L[i],L[k]]=[L[k],L[i]];order(L)}
function byZip(){order(dayJobs().sort((a,b)=>zip(jaddr(a)).localeCompare(zip(jaddr(b)))))}
function addStop(id){if(!id)return;const j=S.jobs[id];if(!j||j.status!=="Scheduled"){rmsg("That job is no longer scheduled. Refresh the route and try again.");return}j.ord=dayJobs().length;j.date=rd;w("jobs",j);render()}
const rmsg=t=>{const m=$("#rmsg");if(m)m.textContent=t};
function useLoc(){if(!navigator.geolocation){rmsg("Location isn’t available on this device.");return}
 navigator.geolocation.getCurrentPosition(p=>{S.meta.start=p.coords.latitude.toFixed(5)+","+p.coords.longitude.toFixed(5);wm();render()},()=>rmsg("Couldn’t get your location. Type the start address instead."))}
function clearGeo(){try{localStorage.removeItem("mibgeo")}catch(e){}}
const point=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180;
function coords(a){const m=String(a||"").trim().match(/^(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)$/);if(!m)return null;const p=[+m[1],+m[2]];return point(p)?p:null}
const hv=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 7917.6*Math.asin(Math.sqrt(Math.max(0,Math.min(1,h))))};
function tsp(s,P,round=false){const n=P.length,pt=x=>x<0?s:P[x],d=(a,b)=>hv(pt(a),pt(b));let o=[],u=new Set(P.keys()),c=-1;
 while(u.size){let b=-1,bd=1e9;u.forEach(j=>{const x=d(c,j);if(x<bd){bd=x;b=j}});o.push(b);u.delete(b);c=b}
 for(let imp=1,it=0;imp&&it<60;it++){imp=0;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const p=i?o[i-1]:-1,next=k<n-1?o[k+1]:(round?-1:null),x=d(p,o[k])+(next===null?0:d(o[i],next))-d(p,o[i])-(next===null?0:d(o[k],next));if(x<-1e-9){o.splice(i,k-i+1,...o.slice(i,k+1).reverse());imp=1}}}
 return o}
function opt(){const L=dayJobs();if(L.length<2){rmsg("Add at least 2 stops first.");return}
 const st=(S.meta.start||"").trim(),start=st?coords(st):null;if(st&&!start){rmsg("Auto-pick needs GPS coordinates for the start. Tap Use my location or leave it blank.");return}
 const pts=L.map(j=>[j,coords(jaddr(j))]);if(pts.some(x=>!x[1])){rmsg("Auto-pick needs GPS coordinates for every stop. Arrange street-address stops manually.");return}
 let first=null,s=start;if(!s){first=pts.shift();s=first[1]}
 const o=tsp(s,pts.map(x=>x[1]),!!start&&!!S.meta.round),res=(first?[first[0]]:[]).concat(o.map(i=>pts[i][0]));
 order(res);rmsg("Route ordered by approximate straight-line distance. Check drive times in Google Maps.")}
function vJobs(){const od=today();let L=arr(S.jobs).filter(j=>jf=="All"||(jf=="Open"?j.status!="Paid":j.status==jf)).sort((a,b)=>a.date>b.date?1:-1);
 return`<select onchange="jf=this.value;render()">${["Open",...JS,"All"].map(o=>`<option${o==jf?" selected":""}>${o}</option>`).join("")}</select>`+(L.map(j=>{const late=j.status=="Scheduled"&&j.date<od,nx=JS[JS.indexOf(j.status)+1];
 return`<div class="card" onclick="openJob('${j.id}')"><div class="sp"><b>${E(cname(j.client))}</b><b>${money(j.price)}</b></div><div class="m">${E(j.service)}${j.prop?" · "+E(j.prop):""}</div>
 <div class="m">${E(j.date)} <span class="chip">${j.status}</span>${late?'<span class="chip bad">Overdue</span>':""}${j.repeat&&j.repeat!="One-time"?`<span class="chip">${E(j.repeat)}</span>`:""}</div>
 <div class="row">${nx?`<button onclick="event.stopPropagation();setStatus('${j.id}','${nx}')">→ ${nx}</button>`:""}<button onclick="event.stopPropagation();openDoc('${j.id}')">${j.status=="Scheduled"?"Quote":"Invoice"}</button></div></div>`}).join("")||'<p class="m">No jobs here.</p>')}
/* jobs */
function spawn(j){if(j.repeat&&j.repeat!="One-time"&&!j.spawned&&j.status!="Scheduled"){const n=Object.assign({},j,{id:uid("j"),date:addD(j.date,j.repeat=="Weekly"?7:14,j.repeat=="Monthly"),status:"Scheduled",spawned:false});delete n.ord;j.spawned=true;w("jobs",n);w("jobs",j)}}
function setStatus(id,s){const j=S.jobs[id];j.status=s;w("jobs",j);spawn(j);render()}
/* dialogs */
const dlg=h=>{$("#dlg").innerHTML=h;if(!$("#dlg").open)$("#dlg").showModal()},closeD=()=>{$("#dlg").close();later()};
$("#dlg").addEventListener("close",()=>{if(pend)setTimeout(later,0)});
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&!busy())render()},80));
const bt=(id,key,del)=>`<div class="bt"><button class="pri" onclick="${key}('${id||""}')">Save</button>${id&&del?`<button class="dg" onclick="${del}('${id}')">Delete</button>`:""}<button onclick="closeD()">Cancel</button></div>`;
function openClient(id){const c=id?S.clients[id]:{type:TY[0],stage:"Lead"},v=k=>E(c[k]);
 dlg(`<h2>${id?"Edit":"New"} client</h2>`+F("Name",`<input id="c_name" value="${v("name")}">`)+F("Contact",`<input id="c_contact" value="${v("contact")}">`)+F("Phone",`<input id="c_phone" type="tel" value="${v("phone")}">`)+F("Email",`<input id="c_email" type="email" value="${v("email")}">`)+F("Type",sel(TY,c.type,"c_type"))+F("Stage",sel(ST,c.stage,"c_stage"))+F("Properties (one address or unit per line)",`<textarea id="c_props" rows="3">${v("props")}</textarea>`)+F("Notes (gate codes, mower access, pets)",`<textarea id="c_notes" rows="3">${v("notes")}</textarea>`)+bt(id,"saveClient","delClient"))}
function saveClient(id){const n=$("#c_name").value.trim();if(!n){$("#c_name").focus();return}
 w("clients",Object.assign({},S.clients[id]||{},{id:id||uid("c"),name:n,contact:$("#c_contact").value,phone:$("#c_phone").value,email:$("#c_email").value,type:$("#c_type").value,stage:$("#c_stage").value,props:$("#c_props").value,notes:$("#c_notes").value}));closeD();render()}
function delClient(id){if(!confirm("Delete this client and all of their jobs?"))return;jobsOf(id).forEach(j=>rm("jobs",j.id));rm("clients",id);closeD();render()}
const pl=cid=>props(S.clients[cid]).map(p=>`<option value="${E(p)}">`).join("");
function openJob(id,pre){if(!arr(S.clients).length){alert("Add a client first.");openClient();return}pre=pre||{};
 const j=id?S.jobs[id]:{client:pre.client||sorted(S.clients)[0].id,prop:pre.prop||"",service:SV[1],date:pre.date||today(),status:"Scheduled",repeat:"One-time",items:"",price:""};
 if(!id&&!j.prop)j.prop=props(S.clients[j.client])[0]||"";
 dlg(`<h2>${id?"Edit":"New"} job</h2>`+F("Client",`<select id="j_client" onchange="jc()">${sorted(S.clients).map(c=>`<option value="${c.id}"${c.id==j.client?" selected":""}>${E(c.name)}</option>`).join("")}</select>`)+F("Service",sel(SV,j.service,"j_service"))+
 F("Property / unit",`<input id="j_prop" list="pl" value="${E(j.prop)}"><datalist id="pl">${pl(j.client)}</datalist>`)+F("Date",`<input id="j_date" type="date" value="${E(j.date)}">`)+F("Status",sel(JS,j.status,"j_status"))+F("Repeat",sel(RP,j.repeat,"j_rep"))+
 F("Line items (description | qty | rate)",`<textarea id="j_items" rows="4" oninput="calc()">${E(j.items)}</textarea>`)+`<select id="j_rate" onchange="addRate(this)"><option value="">Add from rate card…</option>${rates().map((r,i)=>`<option value="${i}">${E(r[0])} — ${money(r[1])}</option>`).join("")}</select>`+
 F("Price ($)",`<input id="j_price" type="number" step="0.01" value="${E(j.price)}">`)+F("Notes",`<textarea id="j_notes" rows="2">${E(j.notes)}</textarea>`)+bt(id,"saveJob","delJob"))}
function jc(){const c=S.clients[$("#j_client").value];$("#pl").innerHTML=pl(c&&c.id);if(!$("#j_prop").value)$("#j_prop").value=props(c)[0]||""}
function calc(){const t=$("#j_items").value;if(t.trim())$("#j_price").value=+total(t).toFixed(2)}
function addRate(s){const r=rates()[s.value];if(!r)return;const t=$("#j_items");t.value=(t.value.trim()?t.value.trim()+"\n":"")+r[0]+" | 1 | "+r[1];calc();s.value=""}
function saveJob(id){const o=Object.assign({},S.jobs[id]||{},{id:id||uid("j"),client:$("#j_client").value,service:$("#j_service").value,prop:$("#j_prop").value.trim(),date:$("#j_date").value||today(),status:$("#j_status").value,repeat:$("#j_rep").value,items:$("#j_items").value,price:+$("#j_price").value||0,notes:$("#j_notes").value});
 w("jobs",o);spawn(o);closeD();render()}
function delJob(id){if(!confirm("Delete this job?"))return;rm("jobs",id);closeD();render()}
function openRates(){dlg(`<h2>Rate card</h2><p class="m">One "name | price" per line. These are placeholder starter rates — replace them with your real pricing.</p><textarea id="rt" rows="9">${E(S.meta.rates==null?DEF:S.meta.rates)}</textarea><div class="bt"><button class="pri" onclick="S.meta.rates=$('#rt').value;wm();closeD()">Save</button><button onclick="closeD()">Cancel</button></div>`)}
const copy=async t=>{try{await navigator.clipboard.writeText(t);return 1}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return 0}}};
function openBackup(){dlg(`<h2>Backup</h2><p class="m">Copy this JSON somewhere safe. To restore, paste a backup here and tap Restore.</p><textarea id="bk" rows="10">${E(JSON.stringify({clients:S.clients,jobs:S.jobs,meta:S.meta}))}</textarea><div class="bt"><button class="pri" onclick="bcopy()">Copy</button><button class="dg" onclick="restore()">Restore</button><button onclick="closeD()">Close</button></div>`)}
async function bcopy(){$("#bk").select();alert(await copy($("#bk").value)?"Copied.":"Copy failed — select the text and copy it manually.")}
function restore(){let d;try{d=JSON.parse($("#bk").value);if(!d||typeof d.clients!="object"||typeof d.jobs!="object")throw 0}catch(e){alert("That doesn’t look like a valid backup.");return}
 if(!confirm("Replace ALL current data with this backup?"))return;
 ["clients","jobs"].forEach(c=>{Object.keys(S[c]).forEach(id=>{if(!d[c][id])rm(c,id)});Object.keys(d[c]).forEach(id=>{d[c][id].id=id;w(c,d[c][id])})});
 S.meta=d.meta||{};wm();closeD();render()}
/* quote / invoice */
const lines=j=>parseItems(j.items).length?parseItems(j.items):[{d:j.service,q:1,r:+j.price||0}];
function openDoc(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 $("#doc").innerHTML=`<div class="sheet"><div class="bt noprint" style="margin-bottom:14px"><button onclick="dcopy('${id}')">Copy text</button><button class="pri" onclick="dprint()">Print / PDF</button><button onclick="$('#doc').hidden=true;later()">Close</button></div>
 <h2 style="font-size:22px;margin:0">Maintain It Bandits</h2><div class="m">Lawn care &amp; landscaping · Austin, TX</div><h2 style="margin-top:16px">${k}</h2>
 <div><b>Client:</b> ${E(c.name)}</div><div><b>Property:</b> ${E(j.prop||"—")}</div><div><b>Date:</b> ${E(j.date)}</div>
 <table><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr>${lines(j).map(i=>`<tr><td>${E(i.d)}</td><td class="r">${i.q}</td><td class="r">${money(i.r)}</td><td class="r">${money(i.q*i.r)}</td></tr>`).join("")}</table>
 <div class="tot">Total: ${money(j.price)}</div>${j.notes?`<p><b>Notes:</b> ${E(j.notes)}</p>`:""}<p>Thank you for your business.</p></div>`;$("#doc").hidden=false;$("#doc").scrollTop=0}
async function dcopy(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 const t=["Maintain It Bandits — "+k,"Client: "+(c.name||""),"Property: "+(j.prop||"—"),"Date: "+j.date,"",...lines(j).map(i=>`${i.d} — ${i.q} x ${money(i.r)} = ${money(i.q*i.r)}`),"","Total: "+money(j.price),j.notes?"Notes: "+j.notes:"","","Thank you for your business."].join("\n");
 alert(await copy(t)?"Copied.":"Copy failed.")}
function dprint(){try{window.print()}catch(e){alert("Printing isn’t available here. Use Copy text instead.")}}
boot();
</script></body></html>
