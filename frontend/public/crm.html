function importLines(text,format="address"){

function importCSV(text,format="address"){

  const c=text[i];
  if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else{quoted=false;afterQuote=true}}else field+=c;continue}
  if(c===","){endField();continue}

function importGpsRows(rows){

 stops.forEach(j=>{const k=routeKey(jaddr(j));if(k){if(!queues.has(k))queues.set(k,[]);queues.get(k).push(j.id)}});
 const ids=lines.map(a=>{const q=queues.get(routeKey(a));if(!q||!q.length)throw new Error("No unmatched stop on this day matches: "+a+". Use the exact saved locations.");const id=q.shift();used.add(id);return id});
 const remaining=stops.filter(j=>!used.has(j.id)).map(j=>j.id),snapshot=stops.map(j=>({id:j.id,client:j.client,clientName:cname(j.client),date:j.date,status:j.status,service:j.service,address:jaddr(j),ord:j.ord==null?null:j.ord}));
 return {date:rd,format,lines,ids:ids.concat(remaining),remaining,snapshot}
}
function reviewRouteOrder(){
 try{
  const p=routeOrderPlan();routeOrderPreview=p;$("#ro_apply").hidden=false;
  const rows=p.ids.map(id=>{const j=S.jobs[id];return `<li>${E(cname(j.client))} — ${E(jaddr(j)||"No location")}</li>`}).join("");
  $("#ro_preview").innerHTML=`<p><b>${p.lines.length}</b> matched stop${p.lines.length===1?"":"s"}. ${p.remaining.length} unlisted stop${p.remaining.length===1?" stays":"s stay"} at the end.</p><details${p.ids.length<=10?" open":""}><summary>New order (${p.ids.length}${p.ids.length>10?"; tap to show all":""})</summary><ol>${rows}</ol></details>`;
  $("#ro_status").textContent="Review the order, then tap Save route order.";
  if(typeof $("#ro_preview").scrollIntoView==="function")$("#ro_preview").scrollIntoView({block:"start"})
 }catch(e){routeOrderPreview=null;$("#ro_apply").hidden=true;$("#ro_preview").innerHTML="";$("#ro_status").textContent=e.message||"Could not review the route order."}
}
function applyRouteOrder(){
 if(!routeOrderPreview){$("#ro_status").textContent="Review the route order first.";return}
 let p;try{p=routeOrderPlan()}catch(e){routeOrderPreview=null;$("#ro_apply").hidden=true;$("#ro_status").textContent=e.message;return}
 if(JSON.stringify(p)!==JSON.stringify(routeOrderPreview)){routeOrderInvalidate();$("#ro_status").textContent="The route changed. Review the order again.";return}
 if(!confirm("Save this order for "+p.ids.length+" stops on "+p.date+"? No jobs will be moved or deleted."))return;
 try{const latest=routeOrderPlan();if(JSON.stringify(latest)!==JSON.stringify(p)){routeOrderInvalidate();$("#ro_status").textContent="The route changed. Review the order again.";return}p=latest}catch(e){routeOrderInvalidate();$("#ro_status").textContent=e.message;return}
 const updates=p.ids.map((id,i)=>Object.assign({},S.jobs[id],{ord:i})).filter((j,i)=>S.jobs[p.ids[i]].ord!==i);
 if(updates.length&&!importStorageAvailable("jobs",updates)){$("#ro_status").textContent="Not enough device storage to safely save this order. Free space and try again.";return}
 routeOrderPreview=null;$("#ro_apply").hidden=true;if(updates.length)wBatch("jobs",updates);$("#ro_preview").innerHTML="";
 $("#ro_status").textContent=storageOK?"Route order saved. Keep this page open until it says Synced across devices.":"The order is in memory but could not be saved locally. Use Backup and keep this page open until synced.";render()
}
/* Private, per-job photos in Supabase Storage. The CRM record backup does not contain photo bytes. */
const PHOTO_BUCKET="mib-crm-job-photos",PHOTO_READY_RPC="mib_crm_photo_storage_private_v1",PHOTO_INPUT_LIMIT=20*1024*1024,PHOTO_OUTPUT_LIMIT=5*1024*1024,PHOTO_LIST_LIMIT=100;
let photoSeq=0,photoJobId="",photoUrl="",photoBusy=false,photoReady=false;
function clearPhotoView(){
 photoSeq++;photoJobId="";photoBusy=false;photoReady=false;if(photoUrl){try{URL.revokeObjectURL(photoUrl)}catch(e){}photoUrl=""}
}
function photoFolder(id){
 const bytes=new TextEncoder().encode(String(id));if(!bytes.length||bytes.length>250)throw new Error("This job ID cannot be used for photos.");
 return "j-"+Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")
}
function photoPathValid(path,id){
 const base=photoFolder(id)+"/";if(!String(path).startsWith(base))return false;
 return /^(before|after)\/p-[a-z0-9]{8,100}\.jpg$/.test(String(path).slice(base.length))
}
function photoCurrent(id,seq){return photoJobId===id&&photoSeq===seq&&$("#dlg").open&&!!$("#ph_status")}
function photoInputs(busy){
 photoBusy=busy;["#ph_before_input","#ph_after_input","#ph_refresh"].forEach(s=>{const e=$(s);if(e)e.disabled=busy||((s!=="#ph_refresh")&&(!synced||!photoReady))})
}
async function privatePhotoBucket(){
 if(!db||!hasSnapshot)throw new Error("Connect and wait for the CRM to load before using job photos.");
 if(typeof sb.rpc!=="function"||!sb.storage)throw new Error("Private photo storage is not configured. Complete the storage setup first.");
 let r;try{r=await sb.rpc(PHOTO_READY_RPC)}catch(e){r=null}
 if(!r||r.error||r.data!==true)throw new Error("Private photo storage is not ready. Ask the administrator to finish the private bucket and policy setup.");
 return sb.storage.from(PHOTO_BUCKET)
}
function photoListMarkup(id,kind,files){
 if(!files.length)return `<p class="m">No ${kind} photos yet.</p>`;
 return files.map((f,i)=>{const path=photoFolder(id)+"/"+kind+"/"+f.name;return `<div class="row"><span class="m">${kind==="before"?"Before":"After"} photo ${i+1}</span><button data-path="${E(path)}" onclick="viewJobPhoto(this)">View</button><button class="dg" data-path="${E(path)}" onclick="removeJobPhoto(this)">Delete</button></div>`}).join("")
}
function openJobPhotos(id){
 const j=S.jobs[id];if(!j){alert("That job no longer exists.");return}
 dlg(`<h2>Before / after photos</h2><p>${E(cname(j.client))} · ${E(j.date)}</p><p class="m">Photos need an internet connection and a private team storage setup. Save and sync the job first. The CRM JSON backup does not include the photo files.</p>
 <h3>Before</h3><label for="ph_before_input">Add a before photo</label><input id="ph_before_input" type="file" accept="image/*" disabled onchange="uploadJobPhoto(this,'before')"><div id="ph_before_list"></div>
 <h3>After</h3><label for="ph_after_input">Add an after photo</label><input id="ph_after_input" type="file" accept="image/*" disabled onchange="uploadJobPhoto(this,'after')"><div id="ph_after_list"></div>
 <p class="m">Photos are resized and saved as JPEG. The newest 100 per section are shown.</p><div class="bt"><button id="ph_refresh" onclick="refreshJobPhotos()">Refresh photos</button><button onclick="closeD()">Close</button></div>
 <p id="ph_status" class="m" role="status" aria-live="polite">Checking private photo storage…</p><div id="ph_view"></div>`);
 photoJobId=String(id);const seq=++photoSeq;loadJobPhotos(photoJobId,seq)
}
async function loadJobPhotos(id,seq){
 if(!photoCurrent(id,seq))return;$("#ph_status").textContent="Checking private photo storage…";
 try{
  if(!S.jobs[id])throw new Error("This job no longer exists.");
  const bucket=await privatePhotoBucket();if(!photoCurrent(id,seq))return;
  const folder=photoFolder(id),results=await Promise.all(["before","after"].map(k=>bucket.list(folder+"/"+k,{limit:PHOTO_LIST_LIMIT+1,sortBy:{column:"created_at",order:"desc"}})));
  if(!photoCurrent(id,seq))return;if(results.some(r=>!r||r.error||!Array.isArray(r.data)))throw new Error("Could not load photos. Check the private storage policies and your connection.");
  const groups=results.map(r=>r.data.filter(f=>f&&/^p-[a-z0-9]{8,100}\.jpg$/.test(String(f.name||""))));
  $("#ph_before_list").innerHTML=photoListMarkup(id,"before",groups[0].slice(0,PHOTO_LIST_LIMIT));
  $("#ph_after_list").innerHTML=photoListMarkup(id,"after",groups[1].slice(0,PHOTO_LIST_LIMIT));
  $("#ph_status").textContent=!synced?"Wait until the CRM says Synced across devices, then tap Refresh photos before uploading.":groups.some(g=>g.length>PHOTO_LIST_LIMIT)?"Showing the newest 100 photos in each section.":"Choose a photo to upload, or view an existing photo.";
  photoReady=true;photoInputs(false);return true
 }catch(e){if(photoCurrent(id,seq)){photoReady=false;$("#ph_status").textContent=e.message||"Could not load photos.";photoInputs(false)}return false}
}
function refreshJobPhotos(){if(!photoJobId||photoBusy)return;const id=photoJobId,seq=++photoSeq;photoReady=false;photoInputs(true);if(photoUrl){try{URL.revokeObjectURL(photoUrl)}catch(e){}photoUrl=""}$("#ph_view").innerHTML="";loadJobPhotos(id,seq)}
function prepareJobPhoto(file){
 if(!file||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(String(file.type||"")))return Promise.reject(new Error("Choose a JPEG, PNG, WebP or HEIC photo from your camera or library."));
 if(!Number.isFinite(file.size)||file.size<1||file.size>PHOTO_INPUT_LIMIT)return Promise.reject(new Error("Choose a nonempty photo no larger than 20 MB."));
 return new Promise((resolve,reject)=>{
  let url,img;try{url=URL.createObjectURL(file);img=new Image()}catch(e){if(url)try{URL.revokeObjectURL(url)}catch(x){}reject(new Error("This device cannot read that photo."));return}
  const release=()=>{try{URL.revokeObjectURL(url)}catch(e){}};
  img.onerror=()=>{release();reject(new Error("This device could not read that image. Try a JPEG or PNG."))};
  img.onload=()=>{try{
   const w=img.naturalWidth,h=img.naturalHeight;if(!w||!h||w>20000||h>20000||w*h>80000000)throw new Error("That photo has unsupported dimensions.");
   const scale=Math.min(1,1600/Math.max(w,h)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
   const ctx=canvas.getContext("2d");if(!ctx)throw new Error("Could not prepare this photo on your device.");ctx.drawImage(img,0,0,canvas.width,canvas.height);
   canvas.toBlob(blob=>{release();if(!blob||!Number.isFinite(blob.size)||blob.size<1||blob.size>PHOTO_OUTPUT_LIMIT||String(blob.type).toLowerCase()!=="image/jpeg"){reject(new Error("Could not prepare a JPEG photo under 5 MB."));return}resolve(blob)},"image/jpeg",0.82)
  }catch(e){release();reject(e)}};img.src=url
 })
}
function newPhotoName(){const id=typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function"?crypto.randomUUID().replace(/-/g,""):Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);return "p-"+id+".jpg"}
async function uploadJobPhoto(input,kind){
 const file=input.files&&input.files[0];input.value="";if(!file||photoBusy)return;const id=photoJobId,seq=photoSeq;
 if(!photoCurrent(id,seq)||!["before","after"].includes(kind))return;
 if(!synced||!photoReady){$("#ph_status").textContent="Wait until Synced across devices, then tap Refresh photos.";return}
 photoInputs(true);$("#ph_status").textContent="Preparing and uploading photo… Keep this page open.";
 try{
  const bucket=await privatePhotoBucket(),blob=await prepareJobPhoto(file);if(!photoCurrent(id,seq))return;
  if(!S.jobs[id]||!synced)throw new Error("The job or connection changed. Refresh and try the upload again.");
  const path=photoFolder(id)+"/"+kind+"/"+newPhotoName(),r=await bucket.upload(path,blob,{contentType:"image/jpeg",cacheControl:"0",upsert:false});
  if(!r||r.error||!r.data||r.data.path!==path)throw new Error("The photo could not be uploaded. Check the private storage setup and connection.");
  if(!photoCurrent(id,seq))return;if(!S.jobs[id])throw new Error("The job was deleted while uploading. Ask the storage administrator to review unused photos.");
  const loaded=await loadJobPhotos(id,seq);if(photoCurrent(id,seq))$("#ph_status").textContent=(kind==="before"?"Before":"After")+" photo uploaded."+(loaded?"":" Could not refresh the list; tap Refresh photos.")
 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not upload that photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
async function viewJobPhoto(button){
 const id=photoJobId,seq=photoSeq,path=button.dataset.path;if(photoBusy||!photoCurrent(id,seq)||!photoPathValid(path,id))return;
 photoInputs(true);$("#ph_status").textContent="Loading photo…";
 try{
  const bucket=await privatePhotoBucket(),r=await bucket.download(path,{}, {cache:"no-store"});if(!photoCurrent(id,seq))return;
  if(!r||r.error||!r.data||!Number.isFinite(r.data.size)||r.data.size<1||r.data.size>PHOTO_OUTPUT_LIMIT)throw new Error("Could not load that photo. Check the connection and storage access.");
  if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(r.data);
  $("#ph_view").innerHTML=`<h3>Selected photo</h3><img src="${E(photoUrl)}" alt="Selected job photo" style="max-width:100%;height:auto;border-radius:8px"><p><a href="${E(photoUrl)}" download="job-photo.jpg">Save photo to device</a></p>`;
  $("#ph_status").textContent="Photo loaded on this device.";if(typeof $("#ph_view").scrollIntoView==="function")$("#ph_view").scrollIntoView({block:"start"})
 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not load that photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
async function removeJobPhoto(button){
 const id=photoJobId,seq=photoSeq,path=button.dataset.path;if(photoBusy||!photoCurrent(id,seq)||!photoPathValid(path,id))return;
 if(!confirm("Permanently delete this photo? This cannot be undone."))return;
 if(!photoCurrent(id,seq)||!S.jobs[id])return;photoInputs(true);$("#ph_status").textContent="Deleting photo…";
 try{
  const bucket=await privatePhotoBucket(),r=await bucket.remove([path]);if(!r||r.error||!Array.isArray(r.data)||!r.data.length)throw new Error("Photo deletion was not confirmed. Refresh and check storage access.");
  if(!photoCurrent(id,seq))return;if(photoUrl){URL.revokeObjectURL(photoUrl);photoUrl=""}$("#ph_view").innerHTML="";const loaded=await loadJobPhotos(id,seq);if(photoCurrent(id,seq))$("#ph_status").textContent="Photo deleted."+(loaded?"":" Could not refresh the list; tap Refresh photos.")
 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not delete the photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
const copy=async t=>{try{await navigator.clipboard.writeText(t);return 1}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return 0}}};
function openBackup(){dlg(`<h2>Backup</h2><p class="m">Copy this JSON somewhere private. Restore replaces ALL current CRM records. Photo files are not included; back them up separately.</p><textarea id="bk" rows="10">${E(JSON.stringify({clients:S.clients,jobs:S.jobs,meta:S.meta}))}</textarea><div class="bt"><button class="pri" onclick="bcopy()">Copy</button><button class="dg" onclick="restore()">Restore</button><button onclick="closeD()">Close</button></div>`)}
async function bcopy(){$("#bk").select();alert(await copy($("#bk").value)?"Copied.":"Copy failed — select the text and copy it manually.")}
function restore(){let d;try{d=JSON.parse($("#bk").value);if(!d||typeof d.clients!="object"||typeof d.jobs!="object")throw 0}catch(e){alert("That doesn’t look like a valid backup.");return}
 if(!confirm("Replace ALL current data with this backup? Photo files are not included, and photos for jobs not in the backup will no longer be visible here."))return;
 ["clients","jobs"].forEach(c=>{Object.keys(S[c]).forEach(id=>{if(!d[c][id])rm(c,id)});Object.keys(d[c]).forEach(id=>{d[c][id].id=id;w(c,d[c][id])})});
 S.meta=d.meta||{};wm();closeD();render()}
/* quote / invoice */
const lines=j=>parseItems(j.items).length?parseItems(j.items):[{d:j.service,q:1,r:+j.price||0}];
function openDoc(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 $("#doc").innerHTML=`<div class="sheet"><div class="bt noprint" style="margin-bottom:14px"><button onclick="dcopy('${id}')">Copy text</button><button class="pri" onclick="dprint()">Print / PDF</button><button onclick="$('#doc').hidden=true;later()">Close</button></div>
 <h2 style="font-size:22px;margin:0">Maintain It Bandits</h2><div class="m">Lawn care &amp; landscaping · Austin, TX</div><h2 style="margin-top:16px">${k}</h2>
 <div><b>Client:</b> ${E(c.name)}</div><div><b>Property:</b> ${E(j.prop||"—")}</div><div><b>Date:</b> ${E(j.date)}</div>

async function dcopy(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 const t=["Maintain It Bandits — "+k,"Client: "+(c.name||""),"Property: "+(j.prop||"—"),"Date: "+j.date,"",...lines(j).map(i=>`${i.d} — ${i.q} x ${money(i.r)} = ${money(i.q*i.r)}`),"","Total: "+money(j.price),j.notes?"Notes: "+j.notes:"","","Thank you for your business."].join("\n");
 alert(await copy(t)?"Copied.":"Copy failed.")}
function dprint(){try{window.print()}catch(e){alert("Printing isn’t available here. Use Copy text instead.")}}
boot();
