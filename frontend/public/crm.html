const hv=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 7917.6*Math.asin(Math.sqrt(Math.max(0,Math.min(1,h))))};
function tsp(s,P,round=false){const n=P.length,pt=x=>x<0?s:P[x],d=(a,b)=>hv(pt(a),pt(b));let o=[],u=new Set(P.keys()),c=-1;
 while(u.size){let b=-1,bd=1e9;u.forEach(j=>{const x=d(c,j);if(x<bd){bd=x;b=j}});o.push(b);u.delete(b);c=b}
 for(let imp=1,it=0;imp&&it<60;it++){imp=0;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const p=i?o[i-1]:-1,next=k<n-1?o[k+1]:(round?-1:null),x=d(p,o[k])+(next===null?0:d(o[i],next))-d(p,o[i])-(next===null?0:d(o[k],next));if(x<-1e-9){o.splice(i,k-i+1,...o.slice(i,k+1).reverse());imp=1}}}

/* Address import: review first, add only, and use the existing sync outbox. */
const IMPORT_LIMIT=1000,IMPORT_FILE_LIMIT=1024*1024,IMPORT_ADDRESS_LIMIT=500;
let importPreview=null,importReadSeq=0;
const importKey=a=>a.trim().replace(/\s+/g," ").toLowerCase();
function importAddress(value,row){
 const a=String(value==null?"":value).replace(/\r\n|\r|\n/g,", ").replace(/[ \t]+/g," ").trim();
 if(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(a))throw new Error("Address "+row+" contains an unsupported control character.");
 if(a.length>IMPORT_ADDRESS_LIMIT)throw new Error("Address "+row+" is too long. Use at most "+IMPORT_ADDRESS_LIMIT+" characters per address.");
 return a
}
function importGPS(value,row){
 const a=importAddress(value,row);if(!a)return "";const p=coords(a);
 if(!p)throw new Error("Location "+row+" needs valid decimal latitude, longitude, for example 30.2672, -97.7431.");
 return p[0]+", "+p[1]
}
function importLines(text,format="address"){
 text=String(text||"").replace(/^\uFEFF/,"");
 if(text.length>IMPORT_FILE_LIMIT)throw new Error("This list is too large. Use a file smaller than 1 MB.");
 if(text.includes("\t"))throw new Error("Paste one complete address per line, or one GPS pair per line. For spreadsheet columns, upload a CSV instead.");
 const parse=format==="gps"?importGPS:importAddress;
 const lines=text.split(/\r\n|\r|\n/).map((s,i)=>parse(s,i+1)).filter(Boolean);
 if(lines.length>IMPORT_LIMIT)throw new Error("Import up to "+IMPORT_LIMIT+" addresses at a time. Split this list into smaller batches.");
 return lines
}
function importCSV(text,format="address"){
 text=String(text||"").replace(/^\uFEFF/,"");
 if(text.length>IMPORT_FILE_LIMIT)throw new Error("This CSV is too large. Use a file smaller than 1 MB.");
 let rows=[],row=[],field="",quoted=false,afterQuote=false;
 const endField=()=>{row.push(field);field="";afterQuote=false};
 const endRow=()=>{endField();rows.push(row);row=[]};
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else{quoted=false;afterQuote=true}}else field+=c;continue}
  if(c===","){endField();continue}
  if(c==="\r"||c==="\n"){if(c==="\r"&&text[i+1]==="\n")i++;endRow();continue}
  if(c==='"'){if(afterQuote||field.trim())throw new Error("CSV has an invalid quote. Put double quotes around addresses containing commas.");field="";quoted=true;continue}
  if(afterQuote){if(c===" "||c==="\t")continue;throw new Error("CSV has text after a closing quote.")}
  field+=c
 }
 if(quoted)throw new Error("CSV has an unclosed quote. Check the file and try again.");
 if(field.length||row.length||afterQuote)endRow();
 rows=rows.filter(r=>r.some(v=>v.trim()));
 if(!rows.length)return [];
 if(format==="gps")return importGpsRows(rows);
 const headers=rows[0].map(v=>v.trim().toLowerCase().replace(/[\/_.-]+/g," ").replace(/\s+/g," "));
 const names=["address","full address","property address","service address","street address"];
 const matches=headers.map((v,i)=>names.includes(v)?i:-1).filter(i=>i>=0);
 if(matches.length>1)throw new Error("CSV has more than one address column. Keep one full Address column and try again.");
 let index=0,data=rows;
 if(matches.length){
  index=matches[0];data=rows.slice(1);if(data.some(r=>r.length>headers.length))throw new Error("A CSV row has extra columns. Put quotes around addresses containing commas.");
  const parts=["address 1","address line 1","address 2","address line 2","street","street 1","street 2","street name","street number","apartment","apt","unit","suite","city","town","municipality","state","province","state province","zip","zip code","zipcode","postal code","postcode","city state zip","country","county"];
  const partColumns=headers.map((h,i)=>i!==index&&parts.includes(h)?i:-1).filter(i=>i>=0);
  if(data.some(r=>partColumns.some(i=>(r[i]||"").trim())))throw new Error("This CSV has address parts in separate columns. Combine street, city, state and ZIP into one complete Address column, then remove the separate address columns and try again.")
 }else if(rows.some(r=>r.length!==1))throw new Error("For a CSV with multiple columns, add an Address header containing the complete address.");
 if(data.length>IMPORT_LIMIT)throw new Error("Import up to "+IMPORT_LIMIT+" addresses at a time. Split this file into smaller batches.");
 return data.map((r,i)=>{const a=importAddress(r[index],i+(matches.length?2:1));if(!a)throw new Error("A CSV row is missing its address. Fix or remove that row and try again.");return a})
}
function importGpsRows(rows){
 const heads=rows[0].map(v=>v.trim().toLowerCase().replace(/[\/_.-]+/g," ").replace(/\s+/g," "));
 const find=names=>heads.map((h,i)=>names.includes(h)?i:-1).filter(i=>i>=0);
 const lat=find(["latitude","lat"]),lon=find(["longitude","long","lon","lng"]),single=find(["gps","gps coordinates","coordinates","coordinate","latitude longitude","lat long","address","property address"]);
 if(lat.length>1||lon.length>1||single.length>1||(single.length&&(lat.length||lon.length)))throw new Error("CSV has ambiguous GPS columns. Use one latitude and one longitude column, or one Coordinates column.");
 const header=!!(lat.length||lon.length||single.length);if(header&&!single.length&&(!lat.length||!lon.length))throw new Error("GPS CSV needs both Latitude and Longitude columns.");
 const data=header?rows.slice(1):rows;if(data.length>IMPORT_LIMIT)throw new Error("Import up to "+IMPORT_LIMIT+" locations at a time. Split this file into smaller batches.");
 if(header&&data.some(r=>r.length>heads.length))throw new Error("A CSV row has extra columns. Put quotes around coordinate pairs in one column.");
 if(!header){const widths=new Set(data.map(r=>r.length));if(widths.size!==1||![1,2].includes(data[0].length))throw new Error("GPS CSV needs Latitude and Longitude columns or one quoted coordinate pair per line.")}
 return data.map((r,i)=>{const v=single.length?r[single[0]]:lat.length?(r[lat[0]]||"")+", "+(r[lon[0]]||""):r.length===2?r[0]+", "+r[1]:r[0];const p=importGPS(v,i+(header?2:1));if(!p)throw new Error("A CSV row is missing its GPS coordinates.");return p})
}

async function importFile(input){
 const f=input.files&&input.files[0];if(!f)return;input.value="";importInvalidate();const seq=importReadSeq;$("#imp_status").textContent="Reading file on this device…";
 try{
  if(f.size>IMPORT_FILE_LIMIT)throw new Error("This file is too large. Choose a CSV or TXT file smaller than 1 MB.");

 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not upload that photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
async function viewJobPhoto(button){
 const id=photoJobId,seq=photoSeq,path=button.dataset.path;if(photoBusy||!photoCurrent(id,seq)||!photoPathValid(path,id))return;
 photoInputs(true);$("#ph_status").textContent="Loading photo…";
 try{
  const bucket=await privatePhotoBucket(),r=await bucket.download(path,{}, {cache:"no-store"});if(!photoCurrent(id,seq))return;
  if(!r||r.error||!r.data||!Number.isFinite(r.data.size)||r.data.size<1||r.data.size>PHOTO_OUTPUT_LIMIT)throw new Error("Could not load that photo. Check the connection and storage access.");
  if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(r.data);
  $("#ph_view").innerHTML=`<h3>Selected photo</h3><img src="${E(photoUrl)}" alt="Selected job photo" style="max-width:100%;height:auto;border-radius:8px"><p><a href="${E(photoUrl)}" download="job-photo.jpg">Save photo to device</a></p>`;
  $("#ph_status").textContent="Photo loaded on this device.";if(typeof $("#ph_view").scrollIntoView==="function")$("#ph_view").scrollIntoView({block:"start"})
 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not load that photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
async function removeJobPhoto(button){
 const id=photoJobId,seq=photoSeq,path=button.dataset.path;if(photoBusy||!photoCurrent(id,seq)||!photoPathValid(path,id))return;
 if(!confirm("Permanently delete this photo? This cannot be undone."))return;
 if(!photoCurrent(id,seq)||!S.jobs[id])return;photoInputs(true);$("#ph_status").textContent="Deleting photo…";
 try{
  const bucket=await privatePhotoBucket(),r=await bucket.remove([path]);if(!r||r.error||!Array.isArray(r.data)||!r.data.length)throw new Error("Photo deletion was not confirmed. Refresh and check storage access.");
  if(!photoCurrent(id,seq))return;if(photoUrl){URL.revokeObjectURL(photoUrl);photoUrl=""}$("#ph_view").innerHTML="";const loaded=await loadJobPhotos(id,seq);if(photoCurrent(id,seq))$("#ph_status").textContent="Photo deleted."+(loaded?"":" Could not refresh the list; tap Refresh photos.")
 }catch(e){if(photoCurrent(id,seq))$("#ph_status").textContent=e.message||"Could not delete the photo."}
 finally{if(photoCurrent(id,seq))photoInputs(false)}
}
const copy=async t=>{try{await navigator.clipboard.writeText(t);return 1}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return 0}}};
function openBackup(){dlg(`<h2>Backup</h2><p class="m">Copy this JSON somewhere private. Restore replaces ALL current CRM records. Photo files are not included; back them up separately.</p><textarea id="bk" rows="10">${E(JSON.stringify({clients:S.clients,jobs:S.jobs,meta:S.meta}))}</textarea><div class="bt"><button class="pri" onclick="bcopy()">Copy</button><button class="dg" onclick="restore()">Restore</button><button onclick="closeD()">Close</button></div>`)}
async function bcopy(){$("#bk").select();alert(await copy($("#bk").value)?"Copied.":"Copy failed — select the text and copy it manually.")}
function restore(){let d;try{d=JSON.parse($("#bk").value);if(!d||typeof d.clients!="object"||typeof d.jobs!="object")throw 0}catch(e){alert("That doesn’t look like a valid backup.");return}
 if(!confirm("Replace ALL current data with this backup? Photo files are not included, and photos for jobs not in the backup will no longer be visible here."))return;
 ["clients","jobs"].forEach(c=>{Object.keys(S[c]).forEach(id=>{if(!d[c][id])rm(c,id)});Object.keys(d[c]).forEach(id=>{d[c][id].id=id;w(c,d[c][id])})});
 S.meta=d.meta||{};wm();closeD();render()}
/* quote / invoice */
const lines=j=>parseItems(j.items).length?parseItems(j.items):[{d:j.service,q:1,r:+j.price||0}];
function openDoc(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 $("#doc").innerHTML=`<div class="sheet"><div class="bt noprint" style="margin-bottom:14px"><button onclick="dcopy('${id}')">Copy text</button><button class="pri" onclick="dprint()">Print / PDF</button><button onclick="$('#doc').hidden=true;later()">Close</button></div>
 <h2 style="font-size:22px;margin:0">Maintain It Bandits</h2><div class="m">Lawn care &amp; landscaping · Austin, TX</div><h2 style="margin-top:16px">${k}</h2>
 <div><b>Client:</b> ${E(c.name)}</div><div><b>Property:</b> ${E(j.prop||"—")}</div><div><b>Date:</b> ${E(j.date)}</div>
 <table><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr>${lines(j).map(i=>`<tr><td>${E(i.d)}</td><td class="r">${i.q}</td><td class="r">${money(i.r)}</td><td class="r">${money(i.q*i.r)}</td></tr>`).join("")}</table>
 <div class="tot">Total: ${money(j.price)}</div>${j.notes?`<p><b>Notes:</b> ${E(j.notes)}</p>`:""}<p>Thank you for your business.</p></div>`;$("#doc").hidden=false;$("#doc").scrollTop=0}
async function dcopy(id){const j=S.jobs[id],c=S.clients[j.client]||{},k=j.status=="Scheduled"?"Quote":"Invoice";
 const t=["Maintain It Bandits — "+k,"Client: "+(c.name||""),"Property: "+(j.prop||"—"),"Date: "+j.date,"",...lines(j).map(i=>`${i.d} — ${i.q} x ${money(i.r)} = ${money(i.q*i.r)}`),"","Total: "+money(j.price),j.notes?"Notes: "+j.notes:"","","Thank you for your business."].join("\n");
 alert(await copy(t)?"Copied.":"Copy failed.")}
function dprint(){try{window.print()}catch(e){alert("Printing isn’t available here. Use Copy text instead.")}}
boot();
</script></body></html>
